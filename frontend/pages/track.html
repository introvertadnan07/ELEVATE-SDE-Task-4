<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Track Application | CredVault</title>

    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

<div class="app-shell">

    <header class="topbar">

        <a class="brand" href="../index.html">
            <div class="brand-mark">CV</div>

            <div>
                <strong>CredVault</strong>
                <span>Certificate Issuing & Verification</span>
            </div>
        </a>

        <nav>

            <a href="../index.html">
                ⌂ Home
            </a>

            <a href="request.html">
                ▣ Request Certificate
            </a>

            <a class="nav-active" href="track.html">
                ⌕ Track Application
            </a>

            <a href="verify.html">
                ✓ Verify Certificate
            </a>

        </nav>

        <a class="admin-link" href="admin-login.html">
            Admin
        </a>

    </header>


    <main>

        <div class="narrow">

            <div class="page-head">

                <div>
                    <div class="eyebrow">
                        APPLICATION STATUS
                    </div>

                    <h1>
                        Track Application
                    </h1>

                    <p>
                        Enter your Application ID to see the latest status.
                    </p>
                </div>

            </div>


            <section class="card">

                <form id="trackForm" class="lookup-form">

                    <label class="field">

                        <span>
                            Application ID
                        </span>

                        <input
                            type="text"
                            name="id"
                            placeholder="e.g. #APP-0001"
                        >

                    </label>

                    <button class="btn" type="submit">
                        Track Application
                    </button>

                </form>


                <div id="trackResult"></div>

            </section>

        </div>

    </main>


    <footer>
        © 2026 CredVault · Certificate Issuing & Verification Platform
    </footer>

</div>


<script src="../js/data.js"></script>
<script src="../js/track.js"></script>

</body>
</html>
